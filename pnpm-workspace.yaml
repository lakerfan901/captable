# pnpm >= 10 blocks dependency build scripts unless they are reviewed here.
allowBuilds:
  "@biomejs/biome": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  prisma: true
  sharp: true
  # Optional peer of pdfjs-dist; aliased away in next.config.js and its
  # native build fails on current Node versions.
  canvas: false
  vue-demi: false

# Patched versions of build-time transitive dependencies that their parents
# (next, @sentry/nextjs) pin to vulnerable releases. Remove once the parents
# are upgraded.
overrides:
  "postcss@<8.5.18": "^8.5.18"
  "rollup@>=3.0.0 <3.30.0": "^3.30.0"
