name: captable
services:
  app:
    build:
      target: deps
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: captable-app
    depends_on:
      - pg
      - smtp
      - minio
    restart: always
    ports:
      - 3000:3000
    env_file:
      - ".env"
    working_dir: /app
    command: [/bin/sh, -c, "pnpm install && pnpm dev"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnpm-store

  studio:
    build:
      target: deps
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: captable-studio
    depends_on:
      - pg
      - smtp
      - minio
    restart: always
    ports:
      - 5555:5555
    env_file:
      - ".env"
    working_dir: /app
    command: [/bin/sh, -c, "pnpm install && pnpm db:studio"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnpm-store

  pg:
    image: postgres:15
    container_name: captable-database
    environment:
      - POSTGRES_USER=captable
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=captable
      - POSTGRES_EXTENSIONS=pgcrypto
    ports:
      - 54321:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  smtp:
    image: axllent/mailpit
    container_name: captable-smtp
    ports:
      - 8025:8025
      - 1025:1025

  # MinIO no longer publishes images on Docker Hub; Chainguard builds the same
  # server and client from source. These images have no shell.
  minio:
    image: chainguard/minio:latest
    container_name: captable-minio
    user: "0:0"
    ports:
      - 9002:9002
      - 9001:9001
    volumes:
      - minio:/data
    environment:
      - MINIO_ROOT_USER=captable
      - MINIO_ROOT_PASSWORD=password
    command: ["server", "/data", "--console-address", ":9001", "--address", ":9002"]

  # minio client - runs once to create the buckets, then exits 0
  mc:
    image: chainguard/minio-client:latest
    container_name: captable-minio-client
    restart: on-failure
    depends_on:
      - minio
    environment: &mc-env
      MC_HOST_myminio: http://captable:password@minio:9002
      MC_CONFIG_DIR: /tmp/.mc
    command:
      - mb
      - --ignore-existing
      - myminio/captable-private-bucket
      - myminio/captable-public-bucket

  mc-policy:
    image: chainguard/minio-client:latest
    container_name: captable-minio-policy
    restart: on-failure
    depends_on:
      mc:
        condition: service_completed_successfully
    environment: *mc-env
    command: ["anonymous", "set", "download", "myminio/captable-public-bucket"]

volumes:
  minio:
  postgres:
